[package]
name = "projectrigor"
version = "0.1.0"
edition = "2021"

[lib]
name = "projectrigor"
path = "src/lib.rs"

[[bin]]
name = "projectrigor"
path = "src/main.rs"

[features]
default = []
perf = []  # Enable performance tracking

[profile.release-perf]
inherits = "release"
debug = true  # Include debug symbols for profiling

[dependencies]
winit = { version = "0.30", features = ["rwh_06"] }
metal = "0.29"
objc = "0.2"
cocoa = "0.25"
core-graphics-types = "0.1"
raw-window-handle = "0.6"
glam = "0.29"
rapier3d = "0.22"
hecs = "0.10"
clap = { version = "4.5", features = ["derive"] }
